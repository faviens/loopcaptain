<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Loopcaptain{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='mark.svg') }}">
  <link rel="preload" href="{{ url_for('static', path='fonts/inter-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='board.js') }}" defer></script>
</head>
<body{% block body_attrs %}{% endblock %}>
<header class="top">
  <a class="brand" href="{{ url_for('overview') }}" aria-label="Loopcaptain, all loops"><img src="{{ url_for('static', path='mark.svg') }}" alt="" width="28" height="28">Loopcaptain</a>
  <span class="where">{% block where %}{% endblock %}</span>
  <nav class="strip" aria-label="Pages">
    <a href="{{ url_for('overview') }}"{% if page == 'overview' %} aria-current="page"{% elif page == 'loop' %} aria-current="true"{% endif %}>Loops</a>
    <a href="{{ url_for('connect') }}"{% if page == 'connect' %} aria-current="page"{% endif %}>Connect a loop</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="foot">Reads each loop's <code>.loops/</code> folder on every request. Answers only on this machine.</footer>
</body>
</html>
