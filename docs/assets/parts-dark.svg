<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-label="The parts of Loopcaptain, file by file. A loop in its own repository writes loop.json and appends events.jsonl, either from a script that pastes the helper, or through the MCP server or the command line, which write the same files. The board finds the watched repositories, reads the folder through protocol/store.py on every request, folds the lines into a state in protocol/state.py and renders pages. You read a page and decide: an answer or a stop is appended to inbox.jsonl by app.py, which the loop reads at its next round, and Start runs the one command the loop declared.">
  <title>The parts of Loopcaptain, file by file</title>
  <rect width="1200" height="884" fill="#000000"/>
  <defs>
  <marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#A1A1A6"/></marker>
  <marker id="tip-red" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#A8A1FF"/></marker>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.16"/></filter>
  </defs>
  <g font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="40" y="76" width="320" height="246" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="40" y="70" width="320" height="246" rx="20" fill="#1C1C1E" stroke="#38383A"/><text x="58" y="96" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.4">A LOOP, IN ITS OWN REPOSITORY</text><rect x="52" y="110" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="66" y="134" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">A loop with a script</text><text x="66" y="153" font-size="12.5" font-weight="400" fill="#A1A1A6" >pastes standard/loops.py: emit, inbox</text><rect x="52" y="178" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="66" y="202" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">A loop an agent session drives</text><text x="66" y="221" font-size="12.5" font-weight="400" fill="#A1A1A6" >any coding agent that speaks MCP</text><rect x="52" y="246" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="66" y="270" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">A shell loop</text><text x="66" y="289" font-size="12.5" font-weight="400" fill="#A1A1A6" >calls the command line once per step</text>
  <rect x="440" y="144" width="320" height="178" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="440" y="138" width="320" height="178" rx="20" fill="#1C1C1E" stroke="#38383A"/><text x="458" y="164" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.4">WAYS IN WITHOUT A SCRIPT</text><rect x="452" y="178" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="202" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">mcp_server/server.py</text><text x="466" y="221" font-size="12.5" font-weight="400" fill="#A1A1A6" >five tools over stdio</text><rect x="452" y="246" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="270" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">cli.py</text><text x="466" y="289" font-size="12.5" font-weight="400" fill="#A1A1A6" >emit: one event from a shell loop</text>
  <rect x="840" y="76" width="320" height="246" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="840" y="70" width="320" height="246" rx="20" fill="#1C1C1E" stroke="#38383A"/><text x="858" y="96" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.4">THE LOOP'S FOLDER</text><rect x="852" y="110" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><g transform="translate(860 127)" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4"/></g><text x="888" y="134" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">loop.json</text><text x="888" y="153" font-size="12.5" font-weight="400" fill="#A1A1A6" >the brief, the steps, the caps, start</text><rect x="852" y="178" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><g transform="translate(860 195)" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4"/></g><text x="888" y="202" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">events.jsonl</text><text x="888" y="221" font-size="12.5" font-weight="400" fill="#A1A1A6" >what happened, one line each</text><rect x="852" y="246" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><g transform="translate(860 263)" fill="none" stroke="#A8A1FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4"/></g><text x="888" y="270" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">inbox.jsonl</text><text x="888" y="289" font-size="12.5" font-weight="400" fill="#A1A1A6" >your answer, a note, a stop</text>
  <rect x="840" y="416" width="320" height="314" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="840" y="410" width="320" height="314" rx="20" fill="#1C1C1E" stroke="#38383A"/><text x="858" y="436" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.4">PROTOCOL/: THE STANDARD AS CODE</text><rect x="852" y="450" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="866" y="474" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">store.py</text><text x="866" y="493" font-size="12.5" font-weight="400" fill="#A1A1A6" >atomic write, append, tolerant read</text><rect x="852" y="518" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="866" y="542" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">models.py</text><text x="866" y="561" font-size="12.5" font-weight="400" fill="#A1A1A6" >the manifest, the events, an inbox line</text><rect x="852" y="586" width="-22" height="58" rx="12" fill="#1C1C1E" stroke="#A8A1FF" stroke-width="2"/><text x="866" y="610" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">state.py  fold()</text><text x="866" y="629" font-size="12.5" font-weight="400" fill="#A1A1A6" >lines in: rounds, findings, status out</text><rect x="852" y="654" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="866" y="678" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">validate.py</text><text x="866" y="697" font-size="12.5" font-weight="400" fill="#A1A1A6" >problems and warnings for a loop</text>
  <rect x="440" y="416" width="320" height="382" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="440" y="410" width="320" height="382" rx="20" fill="#1C1C1E" stroke="#38383A"/><text x="458" y="436" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.4">BOARD/: THIS MACHINE ONLY</text><rect x="452" y="450" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="474" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">discover.py</text><text x="466" y="493" font-size="12.5" font-weight="400" fill="#A1A1A6" >the repositories you chose to watch</text><rect x="452" y="518" width="-22" height="58" rx="12" fill="#1C1C1E" stroke="#A8A1FF" stroke-width="2"/><text x="466" y="542" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">app.py</text><text x="466" y="561" font-size="12.5" font-weight="400" fill="#A1A1A6" >routes, host and token guards, CSP</text><rect x="452" y="586" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="610" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">graph.py</text><text x="466" y="629" font-size="12.5" font-weight="400" fill="#A1A1A6" >a round's steps as columns and curves</text><rect x="452" y="654" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="678" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">templates/ + static/</text><text x="466" y="697" font-size="12.5" font-weight="400" fill="#A1A1A6" >overview, loop, file, connect</text><rect x="452" y="722" width="-22.8" height="58" rx="12" fill="#1C1C1E" stroke="#38383A" stroke-width="1.2"/><text x="466" y="746" font-size="13.5" font-weight="600" fill="#F5F5F7" font-family="ui-monospace, SF Mono, Menlo, monospace">steer.py  Runner</text><text x="466" y="765" font-size="12.5" font-weight="400" fill="#A1A1A6" >runs commands.start, no shell</text>
  <rect x="40" y="450" width="320" height="96" rx="20" fill="#0A0A0B" filter="url(#lift)"/>
  <rect x="40" y="444" width="320" height="96" rx="20" fill="#A8A1FF"/>
  <g transform="translate(60 466)" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g>
  <text x="96" y="486" font-size="17" font-weight="600" fill="#000000" >You, in the browser</text>
  <text x="96" y="510" font-size="12.5" font-weight="400" fill="#000000" fill-opacity="0.85">read a page, then answer, stop or start</text>
  <path d="M 360 120 H 835" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="600" y="110" font-size="12.5" font-weight="400" fill="#A1A1A6" text-anchor="middle">writes loop.json, appends events.jsonl</text>
  <path d="M 360 207 H 435" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="400" y="198" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">tool calls</text>
  <path d="M 360 275 H 435" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="400" y="266" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">emit</text>
  <path d="M 760 207 H 835" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <path d="M 760 275 H 835" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="800" y="245" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">same files</text>
  <path d="M 1090 322 V 405" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="1080" y="384" font-size="12.5" font-weight="400" fill="#A1A1A6" text-anchor="end">read on every request</text>
  <path d="M 840 615 H 765" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="800" y="606" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">state</text>
  <path d="M 760 479 H 835" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="800" y="470" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">which folders</text>
  <path d="M 440 478 H 365" fill="none" stroke="#A1A1A6" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="400" y="469" font-size="12" font-weight="400" fill="#A1A1A6" text-anchor="middle">pages</text>
  <path d="M 360 510 H 435" fill="none" stroke="#A8A1FF" stroke-width="1.6" marker-end="url(#tip-red)"/>
  <text x="400" y="530" font-size="12" font-weight="600" fill="#A8A1FF" text-anchor="middle">decision</text>
  <path d="M 690 410 V 376 H 890 V 327" fill="none" stroke="#A8A1FF" stroke-width="1.6" marker-end="url(#tip-red)"/>
  <text x="702" y="396" font-size="12.5" font-weight="600" fill="#A8A1FF" >app.py appends inbox.jsonl</text>
  <path d="M 862 322 V 346 H 270 V 327" fill="none" stroke="#A8A1FF" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#tip-red)"/>
  <text x="284" y="340" font-size="12.5" font-weight="600" fill="#A8A1FF" >the loop reads the inbox at its next round</text>
  <path d="M 130 444 V 327" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#tip)"/>
  <text x="142" y="422" font-size="12.5" font-weight="400" fill="#A1A1A6" >Start: steer.py runs the</text>
  <text x="142" y="438" font-size="12.5" font-weight="400" fill="#A1A1A6" >command the loop declared</text>
  <rect x="40" y="826" width="1120" height="1" fill="#38383A"/>
  <text x="40" y="858" font-size="14" font-weight="400" fill="#A1A1A6" >The board keeps no state of its own: every page is the loop's files, read again.</text>
  </g>
</svg>
