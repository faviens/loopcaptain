<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Loopcaptain: an open protocol for agent loops and a local dashboard to monitor and steer them. A loop writes three small files; the board shows where it stands and takes your answer.">
  <title>Loopcaptain</title>
  <rect width="1200" height="340" fill="#000000"/>
  <rect y="339" width="1200" height="1" fill="#38383A"/>
  <g transform="translate(66 72) scale(1.3125)">
  <rect width="64" height="64" rx="15" fill="#4A3FE0"/>
  <path d="M47.45 27.86A16 16 0 1 1 36.14 16.55" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="44.2" cy="19.8" r="4.1" fill="#FFFFFF"/>
</g>
  <g font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="172" y="141" font-size="84" font-weight="700" fill="#F5F5F7" letter-spacing="-3.4">Loopcaptain</text>
    <text x="68" y="208" font-size="22" font-weight="600" fill="#F5F5F7" letter-spacing="-0.4">One board for every agent loop</text>
    <text x="68" y="242" font-size="16.5" font-weight="400" fill="#A1A1A6" >A loop writes three small files. The board shows where it stands,</text>
    <text x="68" y="267" font-size="16.5" font-weight="400" fill="#A1A1A6" >round by round, and takes your answer. No loop needs this repository.</text>
    <text x="962" y="56" font-size="11" font-weight="600" fill="#A1A1A6" letter-spacing="1.2">ROUNDS</text>
    <text x="962" y="300" font-size="12" font-weight="400" fill="#A1A1A6" >a step per row, its open findings</text>
  </g>
