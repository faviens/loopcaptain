<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-label="How one page comes about. A request for a loop's page passes the host guard in board/app.py and the session cookie of board/access.py, board/discover.py finds the loop among the watched repositories, protocol/store.py reads the loop's files and protocol/models.py validates each line. protocol/state.py folds the lines into rounds, runs, findings and a status, with board/steer.py saying whether a started process is alive; board/graph.py lays out the round, and the template renders it as HTML under a content policy without inline script.">
  <title>How one page comes about</title>
  <g font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="504" fill="#0E0E10"/>
  <defs><marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#A0A09C"/></marker><marker id="tip-red" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#FF6B73"/></marker><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.16"/></filter></defs>
  <rect x="40" y="66" width="1112" height="138" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="40" y="60" width="1112" height="138" rx="20" fill="#1C1C1F" stroke="#38383A"/>
  <text x="58" y="86" font-size="11" font-weight="600" fill="#A0A09C" letter-spacing="1.4">A REQUEST COMES IN: TWO GATES, THEN FIND AND READ THE LOOP</text>
  <rect x="62" y="100" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="76" y="125" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">GET /loop/...</text>
  <text x="76" y="147" font-size="12.5" font-weight="400" fill="#A0A09C" >a request for</text>
  <text x="76" y="164" font-size="12.5" font-weight="400" fill="#A0A09C" >one loop's page</text>
  <rect x="280" y="100" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="294" y="125" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">board/app.py</text>
  <text x="294" y="147" font-size="12.5" font-weight="400" fill="#A0A09C" >the host guard:</text>
  <text x="294" y="164" font-size="12.5" font-weight="400" fill="#A0A09C" >else 400</text>
  <path d="M 260 142 H 276" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="498" y="100" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="512" y="125" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">board/access.py</text>
  <text x="512" y="147" font-size="12.5" font-weight="400" fill="#A0A09C" >the session cookie:</text>
  <text x="512" y="164" font-size="12.5" font-weight="400" fill="#A0A09C" >else the locked page, 401</text>
  <path d="M 478 142 H 494" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="716" y="100" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="730" y="125" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">board/discover.py</text>
  <text x="730" y="147" font-size="12.5" font-weight="400" fill="#A0A09C" >find_loop: only</text>
  <text x="730" y="164" font-size="12.5" font-weight="400" fill="#A0A09C" >watched repositories</text>
  <path d="M 696 142 H 712" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="934" y="100" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="948" y="125" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">protocol/store.py</text>
  <text x="948" y="147" font-size="12.5" font-weight="400" fill="#A0A09C" >reads the loop's files;</text>
  <text x="948" y="164" font-size="12.5" font-weight="400" fill="#A0A09C" >a bad line is a Problem</text>
  <path d="M 914 142 H 930" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="40" y="274" width="1112" height="138" rx="20" fill="#0A0A0B" filter="url(#lift)"/><rect x="40" y="268" width="1112" height="138" rx="20" fill="#1C1C1F" stroke="#38383A"/>
  <text x="58" y="294" font-size="11" font-weight="600" fill="#A0A09C" letter-spacing="1.4">VALIDATE, FOLD, DRAW, ANSWER</text>
  <rect x="62" y="308" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="76" y="333" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">protocol/models.py</text>
  <text x="76" y="355" font-size="12.5" font-weight="400" fill="#A0A09C" >validates</text>
  <text x="76" y="372" font-size="12.5" font-weight="400" fill="#A0A09C" >each line</text>
  <rect x="280" y="308" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="294" y="333" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">board/steer.py</text>
  <text x="294" y="355" font-size="12.5" font-weight="400" fill="#A0A09C" >is the process the</text>
  <text x="294" y="372" font-size="12.5" font-weight="400" fill="#A0A09C" >board started alive?</text>
  <path d="M 260 350 H 276" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="498" y="308" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#FF6B73" stroke-width="2"/>
  <text x="512" y="333" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">protocol/state.py</text>
  <text x="512" y="355" font-size="12.5" font-weight="400" fill="#A0A09C" >fold(): rounds, runs,</text>
  <text x="512" y="372" font-size="12.5" font-weight="400" fill="#A0A09C" >findings, status</text>
  <path d="M 478 350 H 494" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="716" y="308" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="730" y="333" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">board/graph.py</text>
  <text x="730" y="355" font-size="12.5" font-weight="400" fill="#A0A09C" >layout(): columns,</text>
  <text x="730" y="372" font-size="12.5" font-weight="400" fill="#A0A09C" >rows, curves</text>
  <path d="M 696 350 H 712" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <rect x="934" y="308" width="196" height="84" rx="12" fill="#1C1C1F" stroke="#38383A" stroke-width="1.2"/>
  <text x="948" y="333" font-size="13.5" font-weight="600" fill="#F5F5F3" font-family="ui-monospace, SF Mono, Menlo, monospace">templates/loop.html</text>
  <text x="948" y="355" font-size="12.5" font-weight="400" fill="#A0A09C" >HTML under a content</text>
  <text x="948" y="372" font-size="12.5" font-weight="400" fill="#A0A09C" >policy, no inline script</text>
  <path d="M 914 350 H 930" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <path d="M 1032 204 V 230 H 160 V 263" fill="none" stroke="#A0A09C" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="596" y="221" font-size="12.5" font-weight="400" fill="#A0A09C" text-anchor="middle">the manifest, the events, the inbox</text>
  <rect x="40" y="446" width="1120" height="1" fill="#38383A"/><text x="40" y="478" font-size="14" font-weight="400" fill="#A0A09C" >Nothing is stored between two requests: the page is the files, read and folded again.</text>
  </g>
</svg>
