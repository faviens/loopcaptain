<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" role="img" aria-label="Who may do what. The loop's repository holds loop.json and events.jsonl, which the loop writes, inbox.jsonl, which it reads at its next round, and the loop itself. Loopcaptain, on this machine only, reads the files on every request and shows you pages. Your answer or stop is appended to inbox.jsonl as a signed line. Start makes the runner run the one command the loop declared, without a shell.">
  <title>Who may do what</title>
  <g font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="418" fill="#FDFDFB"/>
  <defs><marker id="tip" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#71716E"/></marker><marker id="tip-red" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#D6000B"/></marker><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0E0E10" flood-opacity="0.16"/></filter></defs>
  <rect x="40" y="76" width="330" height="246" rx="20" fill="#CBC8C0" filter="url(#lift)"/><rect x="40" y="70" width="330" height="246" rx="20" fill="#ECEAE5" stroke="#E4E3DE"/><text x="58" y="96" font-size="11" font-weight="600" fill="#71716E" letter-spacing="1.4">THE LOOP'S REPOSITORY, ITS OWN TRUST</text><rect x="52" y="110" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><g transform="translate(60 127)" fill="none" stroke="#0E0E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4"/></g><text x="88" y="134" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="ui-monospace, SF Mono, Menlo, monospace">loop.json, events.jsonl</text><text x="88" y="153" font-size="12.5" font-weight="400" fill="#71716E" >the loop writes them</text><rect x="52" y="178" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><g transform="translate(60 195)" fill="none" stroke="#D6000B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4"/></g><text x="88" y="202" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="ui-monospace, SF Mono, Menlo, monospace">inbox.jsonl</text><text x="88" y="221" font-size="12.5" font-weight="400" fill="#71716E" >the loop reads it at its next round</text><rect x="52" y="246" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><text x="66" y="270" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">The loop</text><text x="66" y="289" font-size="12.5" font-weight="400" fill="#71716E" >a script or an agent session</text>
  <rect x="480" y="76" width="330" height="246" rx="20" fill="#CBC8C0" filter="url(#lift)"/><rect x="480" y="70" width="330" height="246" rx="20" fill="#ECEAE5" stroke="#E4E3DE"/><text x="498" y="96" font-size="11" font-weight="600" fill="#71716E" letter-spacing="1.4">LOOPCAPTAIN, ON THIS MACHINE ONLY</text><rect x="492" y="110" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><text x="506" y="134" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">Reads</text><text x="506" y="153" font-size="12.5" font-weight="400" fill="#71716E" >the files again on every request</text><rect x="492" y="178" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><text x="506" y="202" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">Writes one file</text><text x="506" y="221" font-size="12.5" font-weight="400" fill="#71716E" >a signed line per answer or stop</text><rect x="492" y="246" width="-22.8" height="58" rx="12" fill="#FFFFFF" stroke="#E4E3DE" stroke-width="1.2"/><text x="506" y="270" font-size="13.5" font-weight="600" fill="#0E0E10" font-family="Inter Tight, Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">Runner</text><text x="506" y="289" font-size="12.5" font-weight="400" fill="#71716E" >commands.start, without a shell</text>
  <rect x="920" y="76" width="240" height="246" rx="20" fill="#CBC8C0" filter="url(#lift)"/><rect x="920" y="70" width="240" height="246" rx="20" fill="#D6000B"/>
  <g transform="translate(942 96)" fill="none" stroke="#FDFDFB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></g>
  <text x="978" y="116" font-size="19" font-weight="600" fill="#FDFDFB" >You</text>
  <text x="944" y="162" font-size="13" font-weight="400" fill="#FDFDFB" fill-opacity="0.9">Read where a loop stands.</text>
  <text x="944" y="184" font-size="13" font-weight="400" fill="#FDFDFB" fill-opacity="0.9">Answer it, or stop it after</text>
  <text x="944" y="204" font-size="13" font-weight="400" fill="#FDFDFB" fill-opacity="0.9">its round. Start it, after a</text>
  <text x="944" y="224" font-size="13" font-weight="400" fill="#FDFDFB" fill-opacity="0.9">tick the first time.</text>
  <path d="M 370 139 H 475" fill="none" stroke="#71716E" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="425" y="130" font-size="12.5" font-weight="400" fill="#71716E" text-anchor="middle">read</text>
  <path d="M 810 139 H 915" fill="none" stroke="#71716E" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="865" y="130" font-size="12.5" font-weight="400" fill="#71716E" text-anchor="middle">pages</text>
  <path d="M 920 207 H 815" fill="none" stroke="#D6000B" stroke-width="1.6" marker-end="url(#tip-red)"/>
  <text x="865" y="198" font-size="12.5" font-weight="600" fill="#D6000B" text-anchor="middle">answer, stop</text>
  <path d="M 480 207 H 375" fill="none" stroke="#D6000B" stroke-width="1.6" marker-end="url(#tip-red)"/>
  <text x="425" y="198" font-size="12.5" font-weight="600" fill="#D6000B" text-anchor="middle">appends</text>
  <path d="M 920 275 H 815" fill="none" stroke="#71716E" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#tip)"/>
  <text x="865" y="266" font-size="12.5" font-weight="400" fill="#71716E" text-anchor="middle">start</text>
  <path d="M 480 275 H 375" fill="none" stroke="#71716E" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#tip)"/>
  <text x="425" y="266" font-size="12.5" font-weight="400" fill="#71716E" text-anchor="middle">its command</text>
  <rect x="40" y="360" width="1120" height="1" fill="#E4E3DE"/><text x="40" y="392" font-size="14" font-weight="400" fill="#71716E" >Nothing crosses from the board into a loop except the inbox file and the one command the loop declared.</text>
  </g>
</svg>
