[project]
name = "loopcaptain"
version = "0.0.0"  # a release is a git tag made by CI (scripts/release.py); the wheel is stamped with it
description = "An open protocol for agent loops and a local dashboard to monitor and steer them: plain files, any agent, no dependency."
authors = [{ name = "Daniel Vogler" }]
# The long description is README.md with every address absolute and at the release's tag
# (scripts/pypi_readme.py), so its pictures and links work on the package index.
dynamic = ["readme"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/loopcaptain/board/static/fonts/OFL.txt"]
keywords = [
    "agent loop", "agentic loop", "ai agents", "coding agents", "autonomous agents", "long-running agent",
    "ralph loop", "loop engineering", "agent dashboard", "agent monitoring", "agent protocol",
    "human in the loop", "mcp", "mcp server", "jsonl", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

# The MCP server, for a loop an agent session drives: `uv tool install 'loopcaptain[mcp]'`. The board,
# the helper and the command line need none of it, and the SDK was about half of a plain install.
[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.urls]
Documentation = "https://faviens.github.io/loopcaptain/"
Repository = "https://github.com/faviens/loopcaptain"
Issues = "https://github.com/faviens/loopcaptain/issues"
Changelog = "https://github.com/faviens/loopcaptain/releases"

[project.scripts]
loopcaptain = "loopcaptain.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mcp>=2.0",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml",
]
docs = [
    "zensical>=0.1.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "scripts/pypi_readme.py"

# The source archive holds what builds and tests the package. The pictures of the documentation
# (the README's own are read from the tag's address), the ledgers, the CI files and local caches
# stay in the repository.
[tool.hatch.build.targets.sdist]
exclude = ["/.agent", "/.github", "/.cache", "/docs/assets", "/site", "/demo"]

[tool.hatch.build.targets.wheel]
packages = ["src/loopcaptain"]

# The spec lives in standard/ for readers; the package carries a copy for `loopcaptain spec` and the MCP tool.
[tool.hatch.build.targets.wheel.force-include]
"standard/LOOPS.md" = "loopcaptain/protocol/LOOPS.md"
"standard/prompts/build-a-loop.md" = "loopcaptain/prompt_texts/build-a-loop.md"
"standard/prompts/watch-my-loops.md" = "loopcaptain/prompt_texts/watch-my-loops.md"
"standard/loops.py" = "loopcaptain/demo/loops.py"

[tool.uv]
default-groups = ["dev", "docs"]
# A release is taken only after a week, so a compromised version has time to be caught.
exclude-newer = "7 days"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixtures and the demo's invented history read better on one line.
"tests/*" = ["E501"]
# SVG markup in long lines.
"scripts/readme_assets.py" = ["E501"]
"scripts/shots.py" = ["E501"]
"scripts/docs_pages.py" = ["E501"]
# The helper runs on Python 3.9, which has no `datetime.UTC`; its text is printed in LOOPS.md, so
# the exception lives here rather than as a comment a loop author would paste.
"standard/loops.py" = ["UP017"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# The example loop is a standalone script beside the helper LOOPS.md prints, untyped on purpose:
# it imports `loops` from its own folder, as any loop does.
exclude = ["src/loopcaptain/demo/loop\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
