name: links

# Weekly: do the links in the documents still lead somewhere? Never a gate: a site that is down
# for an hour must not block a change. A failure opens nothing; read the run.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3
            --exclude '^https?://127\.0\.0\.1'
            './**/*.md'
          fail: true
