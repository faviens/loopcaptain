name: docs

# Builds the documentation site on every change to main, and publishes it to GitHub Pages with
# the official flow only when the repository variable PUBLISH_DOCS is "true". A Pages site is
# public even when the repository is private, so publishing waits for the decision to go public.
# Only the deploy job may write to Pages or mint an identity token, in the `github-pages`
# environment. No versioned docs before 1.0.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Build
        run: |
          uv sync --frozen
          uv run --group docs zensical build --clean
          cp docs/llms.txt site/llms.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    if: vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
