name: release

# Every push to main that brings a feat, fix or perf commit gets the next version as a tag and a
# GitHub release, with those commits as its notes and the built wheel attached
# (scripts/release.py, docs/ARCHITECTURE.md section 19). Nothing is committed back, so nobody
# bumps a version, pushes a tag or opens a pull request for one. No tag is made before `make check`
# has passed on the very commit, in this workflow: a release never runs ahead of its checks. The wheel is stamped with the
# tag's version in the runner, proved to work installed outside a checkout, and published to PyPI
# by trusted publishing (no token stored anywhere) once the repository variable PUBLISH_PYPI is
# "true".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time, in push order, so two merges never take the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Check
        run: make check
        env:
          UV_NO_SYNC: "1"

  release:
    name: tag and release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the tag and the release
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every tag and the commits since the last one
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Next version
        id: next
        run: echo "tag=$(uv run --no-project python scripts/release.py --notes "$RUNNER_TEMP/release-notes.md")" >> "$GITHUB_OUTPUT"

      - name: Stamp the version and build
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          uv version "${TAG#v}"
          uv build

      - name: Install the wheel in a clean environment and use it
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          test "$(/tmp/clean/bin/loopcaptain --version)" = "loopcaptain ${TAG#v}"
          /tmp/clean/bin/loopcaptain spec > /dev/null
          /tmp/clean/bin/loopcaptain demo --target /tmp/demo --no-watch
          /tmp/clean/bin/loopcaptain validate --strict /tmp/demo

      - name: Tag and release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.next.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/*.whl dist/*.tar.gz --target "$GITHUB_SHA" --title "$TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.next.outputs.tag != ''
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.tag != '' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # trusted publishing to PyPI
      attestations: write   # build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The index's own attestations (PEP 740), written beside each file in dist/ and uploaded
      # with it by `uv publish`: the package page then says which workflow built the file.
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish
        run: uv publish --trusted-publishing always
