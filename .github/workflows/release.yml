name: release

# Releases are cut from the commits on main, with no tag or version bump made by hand.
# release-please reads the Conventional Commits since the last release and keeps one pull request
# open that bumps the version (fix: patch, feat: minor, a breaking change: minor before 1.0, major
# after) and writes the changelog section. Merging that pull request creates the tag vX.Y.Z and
# the GitHub release. The same run then builds the wheel from the tag, proves it works installed
# outside a checkout, attaches it to the release, and publishes it to PyPI by trusted publishing
# (no token stored anywhere) once the repository variable PUBLISH_PYPI is "true".
# A tag made with the workflow's own token starts no other workflow, which is why the build
# lives here and not behind a tag trigger.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the tag and the GitHub release
      issues: write         # labels on the release pull request
      pull-requests: write  # the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: The tag matches the version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "v$(uv version --short)" = "$TAG"

      - name: Build
        run: uv build

      - name: Install the wheel in a clean environment and use it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          /tmp/clean/bin/loopcaptain --version
          /tmp/clean/bin/loopcaptain spec > /dev/null
          /tmp/clean/bin/loopcaptain demo --target /tmp/demo --no-watch
          /tmp/clean/bin/loopcaptain validate --strict /tmp/demo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attach:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # adds the wheel and the source archive to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attach the built files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # trusted publishing to PyPI
      attestations: write   # build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish
        run: uv publish --trusted-publishing always dist/*
