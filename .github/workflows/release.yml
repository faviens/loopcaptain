name: release

# Runs when the maintainer pushes a tag vX.Y.Z made by `make release`. Builds once, proves the
# wheel works installed outside a checkout, then publishes that same wheel to PyPI by trusted
# publishing (no token stored anywhere) and opens a GitHub release with the changelog section.
# Only the publish job may mint an identity token, and only in the `pypi` environment, which
# needs the maintainer's approval.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: The tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(uv version --short)" = "$TAG"

      - name: Build
        run: uv build

      - name: Install the wheel in a clean environment and use it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          /tmp/clean/bin/loopcaptain --version
          /tmp/clean/bin/loopcaptain spec > /dev/null
          /tmp/clean/bin/loopcaptain demo --target /tmp/demo --no-watch
          /tmp/clean/bin/loopcaptain validate --strict /tmp/demo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # trusted publishing to PyPI
      attestations: write   # build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Notes from the changelog section of this version
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          awk -v v="${TAG#v}" '$0 ~ "^## " v " " {on=1; next} /^## / && on {exit} on'
          CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
