name: pr-description

# The commit-msg hooks keep AI attribution and conversation out of commits and hold the subject
# to Conventional Commits, but nothing local ever sees a pull request's title or description.
# This runs the same hooks on both, so each pattern lives in one place
# (.pre-commit-config.yaml). Separate from ci.yml so editing a description re-runs
# only this, not the whole gate.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  attribution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Through env, never interpolated into the script: the description is untrusted text.
      - name: Write the PR description to a file
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-description.txt"

      - name: Reject AI attribution in the PR description
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            no-agent-coauthors --hook-stage commit-msg
            --commit-msg-filename ${{ runner.temp }}/pr-description.txt

      # The description is about the change, never about the conversation that led to it
      # (AGENTS.md, "Commits and pull requests").
      - name: Reject conversation in the PR description
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            no-conversation --hook-stage commit-msg
            --commit-msg-filename ${{ runner.temp }}/pr-description.txt

      # The title becomes a line of the changelog when a pull request is squashed.
      - name: Write the PR title to a file
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title.txt"

      - name: The PR title is a Conventional Commit subject
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            conventional-commit --hook-stage commit-msg
            --commit-msg-filename ${{ runner.temp }}/pr-title.txt
