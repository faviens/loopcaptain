name: Something is wrong
description: The board, the command line or the MCP server does not do what it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The commands, the page, and a few lines of the loop's files if they matter. Invent the content; never paste a real loop's text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`loopcaptain --version` or the commit"
  - type: input
    id: system
    attributes:
      label: System and browser
