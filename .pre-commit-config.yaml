# Install with: make setup
# Run over everything with: uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Workflows: security (zizmor) and correctness (actionlint, the schemas below).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        exclude: ^uv\.lock$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      # The upstream mypy mirror runs isolated and cannot see project
      # dependencies, which produces phantom import errors.
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: no-em-dash
        name: no em-dashes
        language: pygrep
        entry: "—"
        exclude: ^(uv\.lock|\.pre-commit-config\.yaml)$
        types: [text]

      - id: no-dotenv-committed
        name: no .env committed
        language: fail
        files: '^\.env$|(^|/)\.env\.(local|[^.]*)$'
        exclude: '(^|/)\.env\.example$'
        entry: .env files must never be committed. Put placeholders in .env.example.

      - id: no-service-account-keys
        name: no service-account key files
        language: pygrep
        types: [json]
        entry: '"type":\s*"service_account"'

      - id: forbidden-words
        name: no words listed in .forbidden-words.local
        language: script
        entry: scripts/forbidden_words.sh
        types: [text]
        exclude: ^uv\.lock$

      - id: no-agent-coauthors
        name: no AI attribution in commit messages
        language: pygrep
        stages: [commit-msg]
        args: [--ignore-case, --multiline]
        entry: 'co-authored-by:.*\b(claude|anthropic|copilot|cursor|gemini|codex|chatgpt|openai|amp|opencode|aider|windsurf|devin|jules)\b|generated with \[?(claude|copilot|cursor|gemini|codex|chatgpt|amp|opencode|aider|windsurf|devin|jules)\b'

      # A message describes the change, not the conversation that led to it: AGENTS.md,
      # "Commits and pull requests", rule 4. This catches the commonest phrases only.
      - id: no-conversation
        name: no conversation in commit messages
        language: pygrep
        stages: [commit-msg]
        args: [--ignore-case, --multiline]
        entry: '\b(the user|the maintainer|the owner|the reviewer|the author) (asked|asks|wants|wanted|said|says|requested|prefers|complained|noted|pointed out|does not want|doesn.t want|did not like|didn.t like)\b|\bas (requested|discussed|asked|agreed|mentioned|instructed)\b|\bper (the |your |our )?(request|feedback|review|discussion|conversation|instructions?)\b|\b(we|you) (discussed|talked about|agreed)\b|\bin (this|our|the) (session|conversation|chat)\b|\byou (asked|said|wanted|mentioned)\b'

      - id: conventional-commit
        name: "commit subject is type(scope): subject"
        language: pygrep
        stages: [commit-msg]
        args: [--negate]
        entry: '\A(feat|fix|refactor|docs|test|chore|perf|ci|build|style|revert)(\([a-z0-9._-]+\))?!?: \S'
