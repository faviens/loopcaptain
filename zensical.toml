[project]
site_name = "Loopcaptain"
site_description = "An open protocol for agent loops and a local dashboard to monitor and steer them: plain files, any agent, no dependency."
site_url = "https://faviens.github.io/loopcaptain/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/faviens/loopcaptain"
repo_name = "loopcaptain"
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Get started" = "get-started.md" },
  { "Setup" = "setup.md" },
  { "Connect or build a loop" = "connect.md" },
  { "Monitor a Ralph or shell loop" = "shell-loop.md" },
  { "Works with every agent" = "agents.md" },
  { "The board" = "board.md" },
  { "The protocol" = "protocol/index.md" },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "MCP tools" = "reference/mcp.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Questions and answers" = "faq.md" },
  { "OpenTelemetry" = "opentelemetry.md" },
  { "Security" = "security.md" },
  { "Architecture" = "ARCHITECTURE.md" },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "contributing.md" },
]

# The pages load nothing from another host: no web fonts, the reader's own are used. The override
# adds what a shared link and a search result show (overrides/main.html).
[project.theme]
custom_dir = "overrides"
font = false

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
pymdownx.tabbed = { alternate_style = true }
attr_list = {}
tables = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
